    <table class="table table-hover">
        <tr>
            <td width="70px">
                <a href="{{ url_for('main.user', username=post.author.username) }}">
                    <img src="{{ post.author.avatar(70) }}" />
                </a>
            </td>
            <td>
                <a class="user_popup" data-popup-url="{{ url_for('main.user_popup', username=post.author.username) }}"
                   href="{{ url_for('main.user', username=post.author.username) }}">
                    {{ post.author.username }}
                </a>
                said {{ moment(post.timestamp).fromNow() }}:
                <br>
                <span id="post{{ post.id }}">{{ post.body }}</span>
                <br>
                {% if post.language and post.language != g.locale %}
                <br><br>
                <a href="#" class="translate-link" data-post-id="{{ post.id }}"
                   data-translate-url="{{ url_for('main.translate_post') }}"
                   onclick="translatePost(event, this)">{{ _('Translate') }}</a>
                {% endif %}
            </td>
        </tr>
    </table>
